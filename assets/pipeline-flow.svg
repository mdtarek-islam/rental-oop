<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="t d">
  <title id="t">RentalOOP rent and return flow</title>
  <desc id="d">Rent sequence from the menu to Customer.rent_car, then the return sequence where the bill rate depends on VIP status and rental length.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 13px; }
    .h { font-size: 15px; font-weight: 600; }
    .s { fill: #8b949e; font-size: 12px; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .out { fill: #161b22; stroke: #3fb950; stroke-width: 1; }
    .focus { fill: #161b22; stroke: #58a6ff; stroke-width: 1; }
    .edge { fill: none; stroke: #58a6ff; stroke-width: 2; stroke-dasharray: 8 8; animation: flow 1.6s linear infinite; }
    .edge.green { stroke: #3fb950; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.4s; } .d3 { animation-delay: 0.6s; }
    .d4 { animation-delay: 0.8s; } .d5 { animation-delay: 1.0s; } .d6 { animation-delay: 1.2s; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @media (prefers-reduced-motion: reduce) { .edge { animation: none; } }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
  </defs>
  <rect width="960" height="590" fill="#0d1117"/>

  <rect class="node" x="40" y="40" width="190" height="56" rx="6"/>
  <text class="h" x="135" y="64" text-anchor="middle">main.py</text>
  <text class="s" x="135" y="83" text-anchor="middle">option 1: type and days</text>
  <path class="edge d1" d="M230 68 H270" marker-end="url(#ab)"/>
  <rect class="node" x="270" y="40" width="190" height="56" rx="6"/>
  <text class="h" x="365" y="64" text-anchor="middle">is_available</text>
  <text class="s" x="365" y="83" text-anchor="middle">RentalShop checks stock</text>
  <path class="edge d2" d="M460 68 H500" marker-end="url(#ab)"/>
  <rect class="node" x="500" y="40" width="190" height="56" rx="6"/>
  <text class="h" x="595" y="64" text-anchor="middle">handout_car</text>
  <text class="s" x="595" y="83" text-anchor="middle">RentalShop gives one car</text>
  <path class="edge d3" d="M690 68 H730" marker-end="url(#ab)"/>
  <rect class="focus" x="730" y="40" width="190" height="56" rx="6"/>
  <text class="h" x="825" y="64" text-anchor="middle">rent_car</text>
  <text class="s" x="825" y="83" text-anchor="middle">Customer stores car and days</text>
  <text class="s" x="40" y="28" text-anchor="start">Rent</text>
  <path class="edge d4" d="M825 96 V133 H135 V170" marker-end="url(#ab)"/>
  <text class="s" x="40" y="160" text-anchor="start">Return</text>
  <rect class="node" x="40" y="170" width="190" height="56" rx="6"/>
  <text class="h" x="135" y="194" text-anchor="middle">return_car</text>
  <text class="s" x="135" y="213" text-anchor="middle">main.py option 3</text>
  <rect class="node" x="270" y="170" width="190" height="56" rx="6"/>
  <text class="h" x="365" y="194" text-anchor="middle">is_returnable</text>
  <text class="s" x="365" y="213" text-anchor="middle">car matches its type</text>
  <rect class="focus" x="500" y="170" width="190" height="56" rx="6"/>
  <text class="h" x="595" y="194" text-anchor="middle">is_vip()</text>
  <text class="s" x="595" y="213" text-anchor="middle">Customer or VIP</text>
  <rect class="node" x="730" y="170" width="190" height="56" rx="6"/>
  <text class="h" x="825" y="194" text-anchor="middle">get_vip_rate</text>
  <text class="s" x="825" y="213" text-anchor="middle">any length of rental</text>
  <path class="edge d5" d="M230 198 H270" marker-end="url(#ab)"/>
  <path class="edge d6" d="M460 198 H500" marker-end="url(#ab)"/>
  <path class="edge d1" d="M690 198 H730" marker-end="url(#ab)"/>
  <text class="s" x="700" y="190" text-anchor="start">yes</text>
  <path class="edge d2" d="M595 226 V300" marker-end="url(#ab)"/>
  <text class="s" x="603" y="260" text-anchor="start">no</text>
  <rect class="focus" x="500" y="300" width="190" height="56" rx="6"/>
  <text class="h" x="595" y="324" text-anchor="middle">days under 7?</text>
  <text class="s" x="595" y="343" text-anchor="middle">regular customer</text>
  <rect class="node" x="270" y="300" width="190" height="56" rx="6"/>
  <text class="h" x="365" y="324" text-anchor="middle">get_below_week_rate</text>
  <text class="s" x="365" y="343" text-anchor="middle">under 7 days</text>
  <rect class="node" x="730" y="300" width="190" height="56" rx="6"/>
  <text class="h" x="825" y="324" text-anchor="middle">get_week_or_more_rate</text>
  <text class="s" x="825" y="343" text-anchor="middle">7 days or more</text>
  <path class="edge d3" d="M500 328 H460" marker-end="url(#ab)"/>
  <path class="edge d4" d="M690 328 H730" marker-end="url(#ab)"/>
  <text class="s" x="470" y="320" text-anchor="end">yes</text>
  <text class="s" x="700" y="320" text-anchor="start">no</text>
  <rect class="focus" x="500" y="410" width="190" height="56" rx="6"/>
  <text class="h" x="595" y="434" text-anchor="middle">get_price</text>
  <text class="s" x="595" y="453" text-anchor="middle">rate times days</text>
  <path class="edge d5" d="M365 356 V438 H500" marker-end="url(#ab)"/>
  <path class="edge d6" d="M825 356 V424 H690" marker-end="url(#ab)"/>
  <path class="edge d2" d="M920 198 H945 V452 H690" marker-end="url(#ab)"/>
  <rect class="out" x="500" y="510" width="190" height="50" rx="6"/>
  <text class="h" x="595" y="540" text-anchor="middle">Bill printed</text>
  <path class="edge green d3" d="M595 466 V510" marker-end="url(#ag)"/>
</svg>
